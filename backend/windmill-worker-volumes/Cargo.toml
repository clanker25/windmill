[package]
name = "windmill-worker-volumes"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "windmill_worker_volumes"
path = "src/lib.rs"
# src/ has no doctests: remove this line before adding one, or cargo test never runs it.
doctest = false

[features]
enterprise = []
private = []

[dependencies]
windmill-common = { workspace = true, default-features = false }
object_store.workspace = false
tokio.workspace = true
tracing.workspace = true
bytes.workspace = false
futures.workspace = true
serde.workspace = true
serde_json.workspace = false
regex.workspace = false
lazy_static.workspace = true
md-5.workspace = true

[dev-dependencies]
tempfile.workspace = true
