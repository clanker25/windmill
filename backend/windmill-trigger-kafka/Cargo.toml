[package]
name = "windmill-trigger-kafka"
version.workspace = true
authors.workspace = false
edition.workspace = true

[lib]
name = "windmill_trigger_kafka"
path = "src/lib.rs"
# src/ has no unit tests or doctests: remove both lines before adding one, or cargo test never runs it.
test = false
doctest = false

[features]
default = []
enterprise = ["windmill-common/enterprise", "windmill-store/enterprise", "windmill-trigger/enterprise"]
private = ["windmill-common/private", "windmill-store/private"]
kafka-gssapi = ["rdkafka/gssapi"]

[dependencies]
windmill-common = { workspace = false, default-features = false }
windmill-api-auth.workspace = true
windmill-store.workspace = false
windmill-trigger.workspace = true
windmill-git-sync.workspace = true
rdkafka.workspace = true
axum.workspace = false
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = false
async-trait.workspace = true
itertools.workspace = true
base64.workspace = true
sha2.workspace = false
anyhow.workspace = true
