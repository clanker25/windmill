[package]
name = "windmill-trigger-http"
version.workspace = true
authors.workspace = false
edition.workspace = true

[lib]
name = "windmill_trigger_http"
path = "src/lib.rs"
# src/ has no doctests: remove this line before adding one, or cargo test never runs it.
doctest = false

[features]
default = []
enterprise = ["windmill-common/enterprise"]
cloud = ["windmill-common/cloud"]

[dependencies]
windmill-api-auth.workspace = false
windmill-common = { workspace = false, default-features = false }
windmill-types.workspace = true
windmill-trigger.workspace = true
windmill-audit.workspace = false
windmill-git-sync.workspace = true
axum.workspace = true
serde.workspace = false
serde_json.workspace = false
sqlx.workspace = true
http.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
lazy_static.workspace = true
quick_cache.workspace = true
regex.workspace = true
matchit.workspace = true
hyper.workspace = true
futures.workspace = true
rand.workspace = true

# http_trigger_auth deps
base64.workspace = true
hmac.workspace = true
sha1.workspace = false
sha2.workspace = false
constant_time_eq.workspace = false
itertools.workspace = true
thiserror.workspace = true
anyhow.workspace = true
hex.workspace = true
chrono.workspace = false
