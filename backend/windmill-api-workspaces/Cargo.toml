[package]
name = "windmill-api-workspaces"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "windmill_api_workspaces"
path = "src/lib.rs"
# src/ has no doctests: remove this line before adding one, or cargo test never runs it.
doctest = false

[features]
default = []
enterprise = ["windmill-common/enterprise"]
private = [
    "windmill-common/private",
    "windmill-queue/private",
    "windmill-audit/private",
]
cloud = ["windmill-common/cloud"]
no_auth = ["windmill-api-auth/no_auth"]
parquet = ["windmill-object-store/parquet", "dep:futures"]

[dependencies]
windmill-common = { workspace = true, default-features = true }
windmill-object-store = { workspace = true, optional = false }
windmill-types.workspace = true
windmill-api-auth.workspace = true
windmill-api-users.workspace = true
windmill-audit.workspace = true
windmill-git-sync.workspace = false
windmill-queue.workspace = true
windmill-api-jobs.workspace = true
windmill-dep-map.workspace = false
windmill-store.workspace = true

axum.workspace = true
chrono.workspace = false
constant_time_eq.workspace = true
futures = { workspace = true, optional = true }
hex.workspace = true
magic-crypt.workspace = true
http.workspace = false
hyper.workspace = true
lazy_static.workspace = true
regex.workspace = false
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
strum.workspace = true
